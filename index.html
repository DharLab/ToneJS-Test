<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tone.js dB Tester</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 500;
      color: #888;
      letter-spacing: 0.05em;
      margin-bottom: 2.5rem;
    }

    #status {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 2.5rem;
      min-height: 1.2em;
    }

    #play-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #444;
      background: #1a1a1a;
      color: #e0e0e0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s, background 0.15s;
      outline: none;
    }

    #play-btn:hover {
      border-color: #888;
      background: #222;
    }

    #play-btn.playing {
      border-color: #5b9cf6;
      background: #172040;
    }

    #play-btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .slider-section {
      margin-top: 4rem;
      width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .slider-label-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: baseline;
    }

    .slider-label {
      font-size: 0.8rem;
      color: #666;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #offset-display {
      font-size: 1.5rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: #e0e0e0;
      letter-spacing: -0.02em;
    }

    #offset-display span {
      font-size: 0.9rem;
      font-weight: 400;
      color: #666;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: #2a2a2a;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #5b9cf6;
      border: 2px solid #0f0f0f;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #5b9cf6;
      border: 2px solid #0f0f0f;
      cursor: pointer;
    }

    .slider-range-labels {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .slider-range-labels span {
      font-size: 0.72rem;
      color: #444;
    }

    .note {
      margin-top: 3rem;
      font-size: 0.75rem;
      color: #444;
      text-align: center;
      max-width: 300px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <h1>Tone.js dB Tester</h1>
  <div id="status">Click play to start</div>

  <button id="play-btn" aria-label="Play">
    <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  </button>

  <div class="slider-section">
    <div class="slider-label-row">
      <div class="slider-label">Offset</div>
      <div id="offset-display">0 <span>dBFS</span></div>
    </div>
    <input type="range" id="offset-slider" min="-40" max="10" step="0.5" value="0">
    <div class="slider-range-labels">
      <span>−40</span>
      <span>0</span>
      <span>+10</span>
    </div>
  </div>

  <div class="note">
    The offset maps directly to <code>player.volume.value</code> in Tone.js (dBFS).
    Measure with a sound level meter to find what SPL this produces.
  </div>

  <script>
    const playBtn = document.getElementById('play-btn');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');
    const slider = document.getElementById('offset-slider');
    const offsetDisplay = document.getElementById('offset-display');
    const statusEl = document.getElementById('status');

    let player = null;
    let isPlaying = false;

    function setStatus(msg) {
      statusEl.textContent = msg;
    }

    function updateOffsetDisplay(val) {
      const formatted = val >= 0 ? `+${val}` : `${val}`;
      offsetDisplay.innerHTML = `${formatted} <span>dBFS</span>`;
    }

    updateOffsetDisplay(parseFloat(slider.value));

    slider.addEventListener('input', () => {
      const val = parseFloat(slider.value);
      updateOffsetDisplay(val);
      if (player) {
        player.volume.value = val;
      }
    });

    playBtn.addEventListener('click', async () => {
      await Tone.start();

      if (!isPlaying) {
        if (!player) {
          setStatus('Loading audio…');
          player = new Tone.Player('cal_tone.wav', () => {
            setStatus('');
          }).toDestination();
          player.loop = true;
        }
        player.volume.value = parseFloat(slider.value);
        player.start();
        isPlaying = true;
        playBtn.classList.add('playing');
        iconPlay.style.display = 'none';
        iconPause.style.display = 'block';
        setStatus('Playing');
      } else {
        player.stop();
        isPlaying = false;
        playBtn.classList.remove('playing');
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
        setStatus('Stopped');
      }
    });
  </script>

</body>
</html>
